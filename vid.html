<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amor Sin Fin ♾️❤️ - Flokelly & Kellyflo</title>

<style>
/* ================= WORLD CLASS LOVE EXPERIENCE ================= */

:root{
--pink:#ff6b9d;
--gold:#ffbe0b;
--hot:#ff006e;
--text:#ffd4e5;
--dark:#1a0520;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
height:100vh;
overflow:hidden;
font-family:Georgia,serif;
background:radial-gradient(circle at top,#3b0a45,var(--dark),#000);
animation:bg 15s infinite alternate;
color:white;
cursor:crosshair;
}

@keyframes bg{
0%{background-position:50% 0%}
100%{background-position:50% 100%}
}

canvas{
position:fixed;
top:0;left:0;
pointer-events:none;
}

#fireworks{z-index:1}
#mouse-trail{z-index:2}

.center{
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
padding:40px;
background:rgba(58,10,69,.35);
border-radius:30px;
backdrop-filter:blur(12px);
border:2px solid rgba(255,107,157,.3);
box-shadow:0 0 80px rgba(255,107,157,.6);
animation:float3d 15s infinite ease-in-out;
z-index:5;
text-align:center;
}

@keyframes float3d{
0%,100%{transform:translate(-50%,-50%) rotateX(0) rotateY(0)}
50%{transform:translate(-50%,-50%) rotateX(8deg) rotateY(12deg)}
}

.center h1{
font-size:4rem;
background:linear-gradient(45deg,var(--hot),var(--pink),var(--gold));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:grad 5s infinite;
}

@keyframes grad{
0%{background-position:0%}
100%{background-position:300%}
}

.center h2{
margin-top:15px;
color:var(--gold);
text-shadow:0 0 30px var(--pink);
}

.center p{
margin-top:20px;
font-size:1.4rem;
line-height:1.9;
color:var(--text);
}

/* HEARTS */
.heart{
position:absolute;
width:18px;height:18px;
transform:rotate(45deg);
animation:rise 8s linear forwards;
}
.heart:before,.heart:after{
content:"";
position:absolute;
width:18px;height:18px;
background:linear-gradient(45deg,var(--hot),var(--pink));
border-radius:50%;
}
.heart:before{left:-9px}
.heart:after{top:-9px}

@keyframes rise{
0%{transform:translateY(0) scale(1) rotate(45deg);opacity:1}
100%{transform:translateY(-100vh) scale(.4) rotate(405deg);opacity:0}
}

.orbit-word{
position:absolute;
font-weight:bold;
color:var(--pink);
text-shadow:0 0 15px var(--pink);
pointer-events:none;
}

/* MUSIC BUTTON */
.music-control{
position:fixed;
bottom:25px;right:25px;
width:60px;height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,107,157,.4);
font-size:26px;
cursor:pointer;
box-shadow:0 0 30px var(--pink);
z-index:10;
}

/* RESPONSIVE */
@media(max-width:768px){
.center h1{font-size:2.6rem}
.center h2{font-size:1.4rem}
.center p{font-size:1rem}
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>
<canvas id="mouse-trail"></canvas>

<div class="center" id="loveBlock">
<h1>♾️ Amor Sin Fin ♾️</h1>
<h2>✨ Flokelly ❣️ Kellyflo ✨</h2>
<p>
Mi vida mía… te amo sin medida 💕<br>
Obsessed con amarte cada segundo 🌹<br>
Eternamente juntos, alma con alma 💫
</p>
</div>

<div class="music-control" id="musicBtn">🎵</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<script>
/* ==================== ENGINE ==================== */

const fw=document.getElementById("fireworks"),
fctx=fw.getContext("2d"),
mt=document.getElementById("mouse-trail"),
mctx=mt.getContext("2d");

let fireworks=[],trail=[],orbit=[];
fw.width=mt.width=innerWidth;
fw.height=mt.height=innerHeight;

window.onresize=()=>{fw.width=mt.width=innerWidth;fw.height=mt.height=innerHeight}

const rnd=(a,b)=>Math.random()*(b-a)+a;

/* FIREWORK PARTICLE */
class Firework{
constructor(x,y,vx,vy,c){
this.x=x;this.y=y;
this.vx=vx;this.vy=vy;
this.life=100;
this.c=c;
}
update(){
this.x+=this.vx;
this.y+=this.vy;
this.vy+=0.05;
this.life--;
}
draw(){
fctx.globalAlpha=this.life/100;
fctx.fillStyle=this.c;
fctx.beginPath();
fctx.arc(this.x,this.y,2.5,0,Math.PI*2);
fctx.fill();
}
}

/* HEART FIREWORK */
function heartFirework(x,y){
for(let t=0;t<Math.PI*2;t+=0.15){
const hx=16*Math.pow(Math.sin(t),3);
const hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
fireworks.push(new Firework(x,y,hx/6,hy/6,"#ff6b9d"));
}
}

/* TEXT FIREWORK */
function textFirework(txt){
const c=document.createElement("canvas"),
cx=c.getContext("2d");
c.width=900;c.height=200;
cx.font="bold 90px Georgia";
cx.fillStyle="white";
cx.textAlign="center";
cx.fillText(txt,450,120);
const d=cx.getImageData(0,0,900,200).data;
for(let y=0;y<200;y+=6){
for(let x=0;x<900;x+=6){
if(d[(y*900+x)*4+3]>150){
fireworks.push(new Firework(
innerWidth/2-450+x,
innerHeight*.3+y,
rnd(-1,1),rnd(-1,1),
"#ff9ecd"
));
}
}
}
}

/* HEART FLOAT */
setInterval(()=>{
const h=document.createElement("div");
h.className="heart";
h.style.left=rnd(0,innerWidth)+"px";
h.style.bottom="-20px";
document.body.appendChild(h);
setTimeout(()=>h.remove(),8000);
},300);

/* AUTO FIREWORKS */
setInterval(()=>{
heartFirework(rnd(0,innerWidth),rnd(0,innerHeight/2));
},900);

setTimeout(()=>textFirework("Flokelly ❣️ Kellyflo"),1200);

/* CLICK */
document.addEventListener("click",e=>{
heartFirework(e.clientX,e.clientY);
});

/* LOOP */
function animate(){
fctx.fillStyle="rgba(0,0,0,.15)";
fctx.fillRect(0,0,fw.width,fw.height);

fireworks.forEach((p,i)=>{
p.update();p.draw();
if(p.life<=0)fireworks.splice(i,1);
});

requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
